name: Patient IO
description: >-
  Patient IO (legal entity Filament Labs, Inc.) was an Austin, Texas care
  coordination and patient engagement platform founded in 2013 by Jason
  Bornhorst, Colin Anawaty, and Brian Gambs out of the Techstars Austin
  accelerator. Its API-first mobile platform connected health systems with
  patients between visits to support the transition to value-based care.
  athenahealth acquired Patient IO in August 2016 and its architecture became
  the foundation of athenahealth's patient-facing athenawell application. The
  standalone product, developer program, and public API surface have since been
  retired; patientio.com now serves only a placeholder page and its mail is
  handled by athenahealth.
